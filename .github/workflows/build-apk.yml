name: Tiqany Acc - Solo Signed Release

on:
  workflow_dispatch:
  push:
    branches: ['feature/functional-icons-header', main, 'fix/scroll-behavior-144', 'feature/manager-finance-ui-from-152']

permissions:
  contents: write

jobs:
  release:
    name: Audit, test, and create signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check weighted costs, settlements and cash shifts
        run: node --test tests/finance-operations.test.cjs
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate all shipped JavaScript before release
        run: node --test tests/release143-javascript-parse.test.cjs
      - name: Validate all application scripts
        run: node --test tests/release144-javascript-parse.test.cjs
      - name: Verify shareholder position and settings alignment
        run: node --test tests/release144-scroll-behavior.test.cjs
      - name: Static release audit
        run: python3 scripts/release_audit.py solo
      - name: Run project tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/test_solo.js
          node tests/test_solo_3551.js
          node tests/test_solo_bundle_grid.js
          node tests/test_solo_consumer_and_balances.js
          node --test tests/arabic-only-and-reachable-ui-3578.test.js tests/arabic-only-and-scroll-3581.test.js
          node tests/test_accounting.js
          node tests/test_invoice_date_price_visible_3561.js
          node tests/test_draft_invoice_balance_3553.js
          node tests/test_signed_licenses.js
          node tests/test_accounts_summary_3552.js
          node tests/test_live_items_3552.js
      - name: Verify on-demand independent-account recovery and sky-blue delete button
        run: node --test tests/release127-profile-archive-visibility.test.js
      - name: Verify first run, complete reset, and conflict-aware recovery
        run: node --test tests/release128-company-lifecycle.test.js
      - name: Verify dashboard-only navigation
        run: node --test tests/release131-home-only-dock.test.js
      - name: Verify explicit popup dismissal
        run: node --test tests/release138-no-outside-dismiss.test.js
      - name: Verify keyboard opens only after intentional edit
        run: node --test tests/release139-no-autokeyboard.test.js
      - name: Verify top-of-screen navigation, Back and visible profit reports
        run: node --test tests/release134-navigation-profit.test.js
      - name: Verify restored protected shareholder edit, Back, and account persistence
        run: |
          node --test tests/release141-shareholder-edit-back.test.js
          node --test tests/capital-ledger-121.test.js tests/test_solo.js
      - name: Verify first-run manager and 100% shareholder allocation
        run: node --test tests/onboarding-shareholders-153.test.cjs
      - name: Verify solo currency exchange accounting and history
        run: |
          node --test tests/currency-exchange-142.test.cjs
          node --test tests/currency-buy-sell-147.test.cjs
          node --test tests/currency-report-local-time-148.test.cjs
          node --test tests/release149-fx-security-controls.test.cjs
          node --test tests/release150-general-currency-rates.test.cjs
          node --check app/src/main/assets/www/static/ta-currency-exchange-core-142.js
          node --check app/src/main/assets/www/static/ta-currency-exchange-ui-142.js
          node --check app/src/main/assets/www/static/ta-report-local-date-148.js
          node --check app/src/main/assets/www/static/ta-fx-buy-sell-147.js
      - name: Test manager-only v152 financial UI enhancements
        run: |
          set -euo pipefail
          node --check app/src/main/assets/www/static/ta-manager-enhancements-152.js
          node --check app/src/main/assets/www/static/ta-pricing-modes-152.js
          node --check app/src/main/assets/www/static/ta-print-customization-152.js
          node --check app/src/main/assets/www/static/ta-thermal-table-152.js
          node --test tests/manager-enhancements-152.test.cjs
          node --test tests/thermal-grid-152.test.cjs
      - name: Verify v152 standalone settings pages and draft Back guard
        run: node --test tests/settings-pages-152.test.cjs
      - name: Verify illustrated controls and header geometry
        run: |
          python -m pip install playwright==1.55.0
          python tests/check_controls.py . solo
          python tests/check_foreign_notices.py app/src/main/assets/www solo
          python tests/check_cash_settings.py app/src/main/assets/www
          node --check app/src/main/assets/www/static/ta-themes-154.js
          python tests/check_themes_154.py app/src/main/assets/www
          python tests/check_legibility_155.py app/src/main/assets/www
      - name: Archive theme review screens
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: theme-review-solo
          path: ${{ runner.temp }}/theme-review/
          retention-days: 5
      - name: Build, sign, and verify app release APK
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SOLO_KEYSTORE_BASE64 }}
          TA_SIGNING_STORE_PASSWORD: ${{ secrets.SOLO_STORE_PASSWORD }}
          TA_SIGNING_KEY_ALIAS: ${{ secrets.SOLO_KEY_ALIAS }}
          TA_SIGNING_KEY_PASSWORD: ${{ secrets.SOLO_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.SOLO_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEYSTORE_BASE64" || -z "$TA_SIGNING_STORE_PASSWORD" ||
                -z "$TA_SIGNING_KEY_ALIAS" || -z "$TA_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::Missing one or more SOLO signing secrets. Refusing to produce a Debug or unsigned release APK."
            exit 1
          fi
          umask 077
          export TA_SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/app-release.jks"
          trap 'rm -f "$TA_SIGNING_KEYSTORE_PATH"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$TA_SIGNING_KEYSTORE_PATH"
          test -s "$TA_SIGNING_KEYSTORE_PATH"

          gradle --no-daemon --console=plain :app:assembleRelease
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          package_info=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          grep -Fq "versionCode='154' versionName='3.5.154'" <<< "$package_info"
          verifier="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$verifier" verify --verbose --print-certs "$apk"
          cert_digest=$("$verifier" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          [[ "$cert_digest" =~ ^[0-9a-fA-F]{64}$ ]] || { echo '::error::Could not read signing certificate SHA-256'; exit 1; }
          # Pin the signer from previously verified signed releases. Android
          # cannot update an installed package if this signing key rotates.
          PINNED_CERT_SHA256="627b41d108268f2d241858f8b82f3b706b4ad134f3545608c149edd9f32d8f59"
          if [[ "${cert_digest,,}" != "$PINNED_CERT_SHA256" ]]; then
            echo '::error::Unexpected APK signing certificate. Refusing release to protect in-place updates.'
            exit 1
          fi
          if [[ -n "$EXPECTED_CERT_SHA256" && "${cert_digest,,}" != "${EXPECTED_CERT_SHA256,,}" ]]; then
            echo '::error::Signing certificate does not match pinned certificate. Update aborted to protect install continuity.'
            exit 1
          fi
          mkdir -p output
          cp "$apk" "output/Tiqany-Acc-Solo-3.5.154-RELEASE.apk"
          (cd output && sha256sum "Tiqany-Acc-Solo-3.5.154-RELEASE.apk" > "Tiqany-Acc-Solo-3.5.154-RELEASE.apk.sha256")
      - name: Upload signed app APK and checksum
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Tiqany-Acc-Solo-3.5.154-RELEASE
          path: |
            output/Tiqany-Acc-Solo-3.5.154-RELEASE.apk
            output/Tiqany-Acc-Solo-3.5.154-RELEASE.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish isolated signed finance preview for direct download
        if: github.ref == 'refs/heads/feature/manager-finance-ui-from-152' || github.ref == 'refs/heads/feature/functional-icons-header'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk='output/Tiqany-Acc-Solo-3.5.154-RELEASE.apk'
          checksum="${apk}.sha256"
          test -s "$apk" && test -s "$checksum"
          tag='tiqany-solo-finance-preview-'"${GITHUB_SHA:0:10}"
          gh release create "$tag" "$apk" "$checksum" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'المحاسب التقني التطبيق المستقل - معاينة تعديلات 3.5.154' --notes 'تكلفة المخزون والتحصيل والاستحقاقات وإقفال الصندوق وتسوية فرق العملة الاختيارية.' --prerelease
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq '.url'
      - name: Publish signed main branch artifact for two-theme update
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk='output/Tiqany-Acc-Solo-3.5.154-RELEASE.apk'
          checksum="${apk}.sha256"
          test -s "$apk" && test -s "$checksum"
          tag='tiqany-solo-themes-'"${GITHUB_SHA:0:10}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$checksum" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$apk" "$checksum" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'المحاسب التقني المستقل 3.5.154' --notes 'تكلفة المخزون والتحصيل والاستحقاقات وإقفال الصندوق وتسوية فرق العملة الاختيارية.' --prerelease
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq '.url'

      - name: Package complete tested project source
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/package_project_source.py "project-downloads/Tiqany-Acc-Solo-Source.zip"
      - name: Publish complete source ZIP in Actions Artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Tiqany-Acc-Solo-Project-Source
          path: project-downloads/Tiqany-Acc-Solo-Source.zip
          if-no-files-found: error
          retention-days: 90
