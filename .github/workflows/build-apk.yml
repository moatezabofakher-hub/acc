name: Tiqany Acc - Solo Signed Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Audit, test, and create signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Static release audit
        run: python3 scripts/release_audit.py solo
      - name: Run project tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/test_solo.js
          node tests/test_solo_3551.js
          node tests/test_solo_bundle_grid.js
          node tests/test_solo_consumer_and_balances.js
          node tests/test_accounting.js
          node tests/test_draft_invoice_balance_3553.js
          node tests/test_signed_licenses.js
          node tests/test_accounts_summary_3552.js
          node tests/test_live_items_3552.js
      - name: Build, sign, and verify app release APK
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SOLO_KEYSTORE_BASE64 }}
          TA_SIGNING_STORE_PASSWORD: ${{ secrets.SOLO_STORE_PASSWORD }}
          TA_SIGNING_KEY_ALIAS: ${{ secrets.SOLO_KEY_ALIAS }}
          TA_SIGNING_KEY_PASSWORD: ${{ secrets.SOLO_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.SOLO_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEYSTORE_BASE64" || -z "$TA_SIGNING_STORE_PASSWORD" ||
                -z "$TA_SIGNING_KEY_ALIAS" || -z "$TA_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::Missing one or more SOLO signing secrets. Refusing to produce a Debug or unsigned release APK."
            exit 1
          fi
          umask 077
          export TA_SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/app-release.jks"
          trap 'rm -f "$TA_SIGNING_KEYSTORE_PATH"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$TA_SIGNING_KEYSTORE_PATH"
          test -s "$TA_SIGNING_KEYSTORE_PATH"

          gradle --no-daemon --console=plain :app:assembleRelease
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          verifier="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$verifier" verify --verbose --print-certs "$apk"
          cert_digest=$("$verifier" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          [[ "$cert_digest" =~ ^[0-9a-fA-F]{64}$ ]] || { echo '::error::Could not read signing certificate SHA-256'; exit 1; }
          if [[ -n "$EXPECTED_CERT_SHA256" && "${cert_digest,,}" != "${EXPECTED_CERT_SHA256,,}" ]]; then
            echo '::error::Signing certificate does not match pinned certificate. Update aborted to protect install continuity.'
            exit 1
          fi
          mkdir -p output
          cp "$apk" "output/Tiqany-Acc-Solo-3.5.52-RELEASE.apk"
          (cd output && sha256sum "Tiqany-Acc-Solo-3.5.52-RELEASE.apk" > "Tiqany-Acc-Solo-3.5.52-RELEASE.apk.sha256")
      - name: Upload signed app APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Tiqany-Acc-Solo-3.5.52-RELEASE
          path: |
            output/Tiqany-Acc-Solo-3.5.52-RELEASE.apk
            output/Tiqany-Acc-Solo-3.5.52-RELEASE.apk.sha256
          if-no-files-found: error
          retention-days: 30
