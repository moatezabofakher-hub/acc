name: Build Tiqany Acc Solo Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android-solo:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout standalone source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Android SDK from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?GitHub runner Android SDK not found}"
          echo "Using Android SDK: $ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager is missing."
            exit 1
          fi

          "$SDKMANAGER" --version
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          else
            echo "API 35 and build-tools 35.0.0 are already installed."
          fi

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check standalone source and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('app/src/main/assets/www/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',text,re.I)
          Path('/tmp/tiqany-solo-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY

          node --check /tmp/tiqany-solo-inline.js

          for f in app/src/main/assets/www/static/*.js; do
            node --check "$f"
          done

          node tests/test_solo.js
          node tests/test_accounting.js
          node tests/test_signed_licenses.js

      - name: Check Android Java source structure
        shell: bash
        run: |
          javac tests/JavaSyntaxCheck.java
          java -cp tests JavaSyntaxCheck app/src/main/java/com/sunshine/accounting/*.java
          test ! -d field_agent
          test ! -f app/src/main/java/com/sunshine/accounting/NativeLocalSync.java

      - name: Configure optional Solo release signing
        shell: bash
        env:
          KEY_B64: ${{ secrets.SOLO_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.SOLO_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SOLO_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SOLO_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "$KEY_B64" && -n "$STORE_PASS" && -n "$KEY_ALIAS" && -n "$KEY_PASS" ]]; then
            export KEY_PATH="$RUNNER_TEMP/tiqany-solo-release.jks"

            printf '%s' "$KEY_B64" | base64 --decode > "$KEY_PATH"
            chmod 600 "$KEY_PATH"

            echo "TA_SIGNING_KEYSTORE_PATH=$KEY_PATH" >> "$GITHUB_ENV"
            echo "TA_SIGNING_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "TA_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "TA_SIGNING_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo 'SOLO_RELEASE=true' >> "$GITHUB_ENV"
          else
            echo 'SOLO_RELEASE=false' >> "$GITHUB_ENV"
          fi

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output

          if [[ "$SOLO_RELEASE" == "true" ]]; then
            gradle --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee build-log.txt

            test -s app/build/outputs/apk/release/app-release.apk

            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

            cp app/build/outputs/apk/release/app-release.apk output/Tiqany-Acc-Solo-SIGNED.apk
          else
            gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build-log.txt

            test -s app/build/outputs/apk/debug/app-debug.apk

            cp app/build/outputs/apk/debug/app-debug.apk output/Tiqany-Acc-Solo-DEBUG.apk
          fi

      - name: Upload downloadable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Tiqany-Acc-Solo-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Tiqany-Acc-Solo-build-log
          path: build-log.txt
          if-no-files-found: ignore
