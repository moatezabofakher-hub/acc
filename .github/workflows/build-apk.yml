name: Tiqany Acc - Solo Signed Release

on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/scroll-behavior-144']

permissions:
  contents: read

jobs:
  release:
    name: Audit, test, and create signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate all shipped JavaScript before release
        run: node --test tests/release143-javascript-parse.test.cjs
      - name: Validate all application scripts
        run: node --test tests/release144-javascript-parse.test.cjs
      - name: Verify shareholder position and settings alignment
        run: node --test tests/release144-scroll-behavior.test.cjs
      - name: Static release audit
        run: python3 scripts/release_audit.py solo
      - name: Run project tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/test_solo.js
          node tests/test_solo_3551.js
          node tests/test_solo_bundle_grid.js
          node tests/test_solo_consumer_and_balances.js
          node --test tests/arabic-only-and-reachable-ui-3578.test.js tests/arabic-only-and-scroll-3581.test.js
          node tests/test_accounting.js
          node tests/test_invoice_date_price_visible_3561.js
          node tests/test_draft_invoice_balance_3553.js
          node tests/test_signed_licenses.js
          node tests/test_accounts_summary_3552.js
          node tests/test_live_items_3552.js
      - name: Verify on-demand independent-account recovery and sky-blue delete button
        run: node --test tests/release127-profile-archive-visibility.test.js
      - name: Verify first run, complete reset, and conflict-aware recovery
        run: node --test tests/release128-company-lifecycle.test.js
      - name: Verify dashboard-only navigation
        run: node --test tests/release131-home-only-dock.test.js
      - name: Verify explicit popup dismissal
        run: node --test tests/release138-no-outside-dismiss.test.js
      - name: Verify keyboard opens only after intentional edit
        run: node --test tests/release139-no-autokeyboard.test.js
      - name: Verify top-of-screen navigation, Back and visible profit reports
        run: node --test tests/release134-navigation-profit.test.js
      - name: Verify restored protected shareholder edit, Back, and account persistence
        run: |
          node --test tests/release141-shareholder-edit-back.test.js
          node --test tests/capital-ledger-121.test.js tests/test_solo.js
      - name: Verify solo currency exchange accounting and history
        run: |
          node --test tests/currency-exchange-142.test.cjs
          node --check app/src/main/assets/www/static/ta-currency-exchange-core-142.js
          node --check app/src/main/assets/www/static/ta-currency-exchange-ui-142.js
      - name: Build, sign, and verify app release APK
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SOLO_KEYSTORE_BASE64 }}
          TA_SIGNING_STORE_PASSWORD: ${{ secrets.SOLO_STORE_PASSWORD }}
          TA_SIGNING_KEY_ALIAS: ${{ secrets.SOLO_KEY_ALIAS }}
          TA_SIGNING_KEY_PASSWORD: ${{ secrets.SOLO_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.SOLO_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEYSTORE_BASE64" || -z "$TA_SIGNING_STORE_PASSWORD" ||
                -z "$TA_SIGNING_KEY_ALIAS" || -z "$TA_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::Missing one or more SOLO signing secrets. Refusing to produce a Debug or unsigned release APK."
            exit 1
          fi
          umask 077
          export TA_SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/app-release.jks"
          trap 'rm -f "$TA_SIGNING_KEYSTORE_PATH"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$TA_SIGNING_KEYSTORE_PATH"
          test -s "$TA_SIGNING_KEYSTORE_PATH"

          gradle --no-daemon --console=plain :app:assembleRelease
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          verifier="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$verifier" verify --verbose --print-certs "$apk"
          cert_digest=$("$verifier" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          [[ "$cert_digest" =~ ^[0-9a-fA-F]{64}$ ]] || { echo '::error::Could not read signing certificate SHA-256'; exit 1; }
          if [[ -n "$EXPECTED_CERT_SHA256" && "${cert_digest,,}" != "${EXPECTED_CERT_SHA256,,}" ]]; then
            echo '::error::Signing certificate does not match pinned certificate. Update aborted to protect install continuity.'
            exit 1
          fi
          mkdir -p output
          cp "$apk" "output/Tiqany-Acc-Solo-3.5.145-RELEASE.apk"
          (cd output && sha256sum "Tiqany-Acc-Solo-3.5.145-RELEASE.apk" > "Tiqany-Acc-Solo-3.5.145-RELEASE.apk.sha256")
      - name: Upload signed app APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Tiqany-Acc-Solo-3.5.145-RELEASE
          path: |
            output/Tiqany-Acc-Solo-3.5.145-RELEASE.apk
            output/Tiqany-Acc-Solo-3.5.145-RELEASE.apk.sha256
          if-no-files-found: error
          retention-days: 30
